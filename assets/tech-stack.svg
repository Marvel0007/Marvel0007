<svg width="850" height="180" viewBox="0 0 850 180" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <style>
      .icon {
        animation: glow 2s ease-in-out infinite;
      }

      .icon:nth-child(2) {
        animation-delay: .3s;
      }

      .icon:nth-child(3) {
        animation-delay: .6s;
      }

      .icon:nth-child(4) {
        animation-delay: .9s;
      }

      .icon:nth-child(5) {
        animation-delay: 1.2s;
      }

      @keyframes glow {
        0%, 100% {
          opacity: .7;
          filter: url(#glow);
        }

        50% {
          opacity: 1;
          filter: url(#glow);
        }
      }
    </style>

  </defs>

  <!-- JavaScript -->
  <g class="icon">
    <rect x="20" y="20" width="100" height="100" rx="20" fill="#F7DF1E"></rect>
    <text x="70" y="87" text-anchor="middle" font-family="Arial" font-size="38" font-weight="bold" fill="#000">
      JS
    </text>
  </g>

  <!-- TypeScript -->
  <g class="icon">
    <rect x="150" y="20" width="100" height="100" rx="20" fill="#3178C6"></rect>
    <text x="200" y="87" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="white">
      TS
    </text>
  </g>

  <!-- React -->
  <g class="icon">
    <circle cx="330" cy="70" r="50" fill="#20232A"></circle>
    <text x="330" y="82" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#61DAFB">
      ⚛
    </text>
  </g>

  <!-- Node -->
  <g class="icon">
    <circle cx="460" cy="70" r="50" fill="#339933"></circle>
    <text x="460" y="80" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">
      Node
    </text>
  </g>

  <!-- Next.js -->
  <g class="icon">
    <circle cx="590" cy="70" r="50" fill="#000"></circle>
    <text x="590" y="78" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="white">
      Next
    </text>
  </g>

</svg>
