<svg width="850" height="180" viewBox="0 0 850 180" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur"></feMergeNode><svg width="900" height="500" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">

<defs>

  <!-- Red glow -->
  <filter id="redGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="5" result="blur"></feGaussianBlur>
    <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.937
              0 0 0 0 0.267
              0 0 0 0 0.267
              0 0 0 1 0"></feColorMatrix>
    <feMerge>
      <feMergeNode></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>

  <style>

    .tech {
      transform-box: fill-box;
      transform-origin: center;
      animation: pulse 3s ease-in-out infinite;
    }

    .t1 { animation-delay: 0s; }
    .t2 { animation-delay: .2s; }
    .t3 { animation-delay: .4s; }
    .t4 { animation-delay: .6s; }
    .t5 { animation-delay: .8s; }
    .t6 { animation-delay: 1s; }
    .t7 { animation-delay: 1.2s; }
    .t8 { animation-delay: 1.4s; }
    .t9 { animation-delay: 1.6s; }
    .t10 { animation-delay: 1.8s; }
    .t11 { animation-delay: 2s; }
    .t12 { animation-delay: 2.2s; }

    @keyframes pulse {

      0%,100% {
        opacity: .72;
        transform: scale(1);
      }

      50% {
        opacity: 1;
        transform: scale(1.08);
      }

    }

    .box {
      fill: #0D1117;
      stroke: #30363D;
      stroke-width: 1.5;
    }

    .box:hover {
      stroke: #EF4444;
    }

    .label {
      fill: #FFFFFF;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      font-weight: 600;
      text-anchor: middle;
    }

    .category {
      fill: #EF4444;
      font-family: "JetBrains Mono", monospace;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
      text-anchor: middle;
    }

    .small {
      fill: #8B949E;
      font-family: "JetBrains Mono", monospace;
      font-size: 11px;
      text-anchor: middle;
    }

  </style>

</defs>


