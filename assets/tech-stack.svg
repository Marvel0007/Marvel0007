    <style>
      .icon {
        animation: glow 2s ease-in-out infinite;
      }

      .icon:nth-child(2) {
        animation-delay: .3s;
      }

      .icon:nth-child(3) {
        animation-delay: .6s;
      }

      .icon:nth-child(4) {
        animation-delay: .9s;
      }

      .icon:nth-child(5) {
        animation-delay: 1.2s;
      }

      @keyframes glow {
        0%, 100% {
          opacity: .7;
          filter: url(#glow);
        }

        50% {
          opacity: 1;
          filter: url(#glow);
        }
      }
