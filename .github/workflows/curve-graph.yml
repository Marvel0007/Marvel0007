name: Generate Curved Graph

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# THIS IS THE FIX: It gives the action permission to save the image
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/curved-graph.svg?palette=github-dark&color_snake=#ef4444&color_dots=#0d1117,#4b1414,#8a1a1a,#ca2020,#ef4444
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
